<!-- UPDATED VERSION: security fixes + Groq AI marking integrated -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fluere</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<h2>Fluere AI Paper Marker</h2>
<textarea id="question" placeholder="Question"></textarea><br><br>
<textarea id="answer" placeholder="Your answer"></textarea><br><br>
<button onclick="mark()">Mark Answer</button>

<div id="output" style="margin-top:20px;font-weight:bold"></div>

<script>
const GROQ_API_KEY = "PASTE_YOUR_KEY_HERE";

async function mark(){
  const q=document.getElementById('question').value;
  const a=document.getElementById('answer').value;
  const out=document.getElementById('output');

  out.innerHTML="Marking... ⏳";

  const prompt = `You are a strict HSC marker.\n\nQuestion: ${q}\n\nAnswer: ${a}\n\nMark out of 5 and give short feedback.`;

  const res = await fetch("https://api.groq.com/openai/v1/chat/completions",{
    method:"POST",
    headers:{
      "Authorization":`Bearer ${GROQ_API_KEY}`,
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      model:"llama-3.3-70b-versatile",
      messages:[{role:"user",content:prompt}]
    })
  });

  const data = await res.json();
  const text = data.choices[0].message.content;

  const markMatch = text.match(/\d+\/\d+/);
  const mark = markMatch ? markMatch[0] : "";

  out.innerHTML = `<div style="font-size:22px">${mark}</div><div>${text}</div>`;
}
</script>

</body>
</html>
