<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0EEF8;--surf:#fff;--surf2:#E8E4F5;--surf3:#F5F3FB;
  --bdr:#DDD8EE;--bdr2:#C8C2E0;
  --txt:#1A1730;--mut:#706C8A;
  --acc:#5B4BD4;--acc-l:#ECEAFA;--acc2:#7B68E8;
  --dan:#C0385A;--dan-l:#FCEEF2;
  --amb:#A06820;--amb-l:#FBF3E3;
  --blu:#2E6BA8;--blu-l:#E3EDF8;
  --grn:#1A7A50;--grn-l:#E3F6EE;
  --r:12px;--rs:8px;
  --sh:0 1px 4px rgba(0,0,0,.06),0 4px 16px rgba(91,75,212,.08);
  --shm:0 8px 32px rgba(91,75,212,.15);
  --font:'Inter',system-ui,sans-serif;--mono:monospace;
}
body{font-family:var(--font);background:var(--bg);color:var(--txt);font-size:15px;line-height:1.6;min-height:100vh}
input,select,textarea,button{font-family:var(--font)}
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:var(--bg)}
.auth-card{background:var(--surf);border:1px solid var(--bdr);border-radius:20px;padding:2.75rem;width:100%;max-width:420px;box-shadow:var(--shm)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:2rem}
.brand-ic{width:38px;height:38px;background:linear-gradient(135deg,var(--acc),var(--acc2));border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(91,75,212,.3)}
.brand-ic svg{width:20px;height:20px;fill:white}
.brand-name{font-size:20px;font-weight:700;letter-spacing:-0.3px}
h2.auth-title{font-size:24px;font-weight:700;margin-bottom:4px;letter-spacing:-0.4px}
.auth-sub{font-size:14px;color:var(--mut);margin-bottom:1.75rem}
.field{margin-bottom:1.1rem}
.field label{display:block;font-size:11px;font-weight:700;margin-bottom:6px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.field input,.field select,.field textarea{width:100%;padding:11px 14px;border:1.5px solid var(--bdr);border-radius:var(--rs);font-size:15px;background:var(--surf3);color:var(--txt);outline:none;transition:all .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--acc);background:var(--surf);box-shadow:0 0 0 4px rgba(91,75,212,.1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:var(--rs);font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid transparent;transition:all .15s;background:none;color:var(--txt)}
.btn-p{background:linear-gradient(135deg,var(--acc),var(--acc2));color:white;width:100%;padding:12px;font-size:15px;border:none;box-shadow:0 4px 12px rgba(91,75,212,.3)}
.btn-p:hover{opacity:.9;transform:translateY(-1px)}
.btn-s{background:var(--surf);color:var(--txt);border-color:var(--bdr2)}
.btn-s:hover{background:var(--surf2);border-color:var(--acc)}
.btn-d{background:var(--dan-l);color:var(--dan);border-color:transparent}
.btn-d:hover{background:#f9d8e2}
.btn-sm{padding:6px 14px;font-size:13px}
.toggle{text-align:center;margin-top:1.25rem;font-size:13px;color:var(--mut)}
.toggle a{color:var(--acc);cursor:pointer;font-weight:600}
.err{background:var(--dan-l);color:var(--dan);border:1.5px solid #f0b8cc;border-radius:var(--rs);padding:10px 14px;font-size:13px;margin-bottom:1rem;display:none}
#app{display:none;min-height:100vh}
.hdr{background:var(--surf);border-bottom:1px solid var(--bdr);padding:0 1.5rem;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--sh)}
.hdr-r{display:flex;align-items:center;gap:.75rem}
.ubadge{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut)}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));color:white;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.rtag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--amb-l);color:var(--amb);letter-spacing:.3px;text-transform:uppercase}
.rtag.cl{background:var(--blu-l);color:var(--blu)}
.app-body{display:flex;min-height:calc(100vh - 64px)}
.sidebar{width:230px;flex-shrink:0;background:var(--surf);border-right:1px solid var(--bdr);padding:1.25rem 1rem;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--rs);font-size:14px;font-weight:500;color:var(--mut);cursor:pointer;transition:all .15s;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--surf2);color:var(--txt)}
.nav-item.on{background:var(--acc-l);color:var(--acc);font-weight:600}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.nav-sep{height:1px;background:var(--bdr);margin:8px 0}
.nav-label{font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.7px;padding:4px 12px;margin-top:4px}
.content{flex:1;padding:2rem;overflow-y:auto;min-width:0}

/* POMODORO */
.pomo-widget{background:var(--surf3);border:1px solid var(--bdr);border-radius:var(--r);padding:1rem;margin-bottom:.75rem;text-align:center}
.pomo-label{font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin-bottom:.6rem}
.pomo-modes{display:flex;gap:3px;justify-content:center;margin-bottom:.6rem}
.pomo-mode{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--bdr2);background:none;color:var(--mut);transition:all .15s}
.pomo-mode.on{background:var(--acc-l);color:var(--acc);border-color:var(--acc)}
.pomo-time{font-size:34px;font-weight:700;letter-spacing:-1px;color:var(--txt);font-family:var(--mono);line-height:1.1}
.pomo-bar{height:4px;background:var(--surf2);border-radius:99px;margin:.6rem 0;overflow:hidden}
.pomo-fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .5s linear}
.pomo-btns{display:flex;gap:5px;justify-content:center}
.pomo-btn{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--bdr2);background:var(--surf);color:var(--mut);transition:all .15s}
.pomo-btn:hover{background:var(--acc-l);border-color:var(--acc);color:var(--acc)}
.pomo-btn.active{background:linear-gradient(135deg,var(--acc),var(--acc2));color:white;border-color:transparent}

/* CARDS */
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:1.5rem;box-shadow:var(--sh);margin-bottom:1rem}
.ci{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--bdr)}
.ci:last-child{border-bottom:none}
.ci-info{display:flex;align-items:center;gap:10px}
.ti{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--bdr)}
.ti:last-child{border-bottom:none}
.chk{width:20px;height:20px;border:2px solid var(--bdr2);border-radius:5px;cursor:pointer;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .2s;background:var(--surf3)}
.chk.on{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;box-shadow:0 2px 8px rgba(91,75,212,.35)}
.chk.pop{animation:chkpop .35s ease}
@keyframes chkpop{0%{transform:scale(1)}40%{transform:scale(1.45)}70%{transform:scale(.9)}100%{transform:scale(1)}}
.ttl{font-weight:600;font-size:14px}
.ttl.dn{text-decoration:line-through;color:var(--mut);font-weight:400}
.tdsc{font-size:13px;color:var(--mut);margin-top:3px}
.tmeta{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.tb{background:var(--blu-l);color:var(--blu)}
.ta{background:var(--amb-l);color:var(--amb)}
.tg{background:var(--grn-l);color:var(--grn)}

/* DATE NAV */
.wn{display:flex;align-items:center;gap:8px;margin-bottom:1.5rem;flex-wrap:wrap}
.wl{font-size:13px;font-weight:600;color:var(--mut);font-family:var(--font);background:var(--surf2);padding:6px 14px;border-radius:var(--rs);border:1px solid var(--bdr);text-align:center}
.wb{width:34px;height:34px;border-radius:var(--rs);border:1.5px solid var(--bdr2);background:var(--surf);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--txt);transition:all .15s}
.wb:hover{background:var(--acc-l);border-color:var(--acc);color:var(--acc)}
.dpick{padding:7px 10px;border:1.5px solid var(--bdr);border-radius:var(--rs);font-size:13px;background:var(--surf3);color:var(--txt);cursor:pointer;outline:none;transition:border-color .15s}
.dpick:focus{border-color:var(--acc)}
.today-btn{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--bdr2);background:var(--surf);color:var(--mut);transition:all .15s}
.today-btn:hover{background:var(--acc-l);border-color:var(--acc);color:var(--acc)}
.pbar{height:8px;background:var(--surf2);border-radius:99px;overflow:hidden;margin-bottom:1.25rem;border:1px solid var(--bdr)}
.pfill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .4s ease}
.pfill.flash{animation:barflash .5s ease}
@keyframes barflash{0%{filter:brightness(1)}50%{filter:brightness(1.5)}100%{filter:brightness(1)}}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(10,8,25,.5);z-index:200;align-items:center;justify-content:center;padding:1rem;display:none}
.modal{background:var(--surf);border-radius:16px;padding:2rem;width:100%;max-width:480px;box-shadow:var(--shm);border:1px solid var(--bdr2)}
.modal-title{font-size:18px;font-weight:700;margin-bottom:1.5rem;letter-spacing:-0.3px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1.5rem}

/* MISC */
.empty{text-align:center;padding:3.5rem 1rem;color:var(--mut)}
.empty-i{font-size:36px;margin-bottom:.75rem}
.empty-t{font-size:15px;font-weight:600;color:var(--txt);margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:2rem}
.sc{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:1.25rem;box-shadow:var(--sh)}
.sn{font-size:30px;font-weight:700;letter-spacing:-0.5px;color:var(--acc)}
.sl{font-size:11px;font-weight:700;color:var(--mut);margin-top:2px;text-transform:uppercase;letter-spacing:.4px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.5rem}
.pill{padding:6px 16px;border-radius:20px;border:1.5px solid var(--bdr2);font-size:13px;font-weight:600;cursor:pointer;background:var(--surf);color:var(--mut);transition:all .15s}
.pill.on{background:var(--acc-l);color:var(--acc);border-color:var(--acc)}
.fchip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;background:var(--acc-l);color:var(--acc);font-size:12px;font-weight:600;cursor:pointer;margin:2px 2px 0 0;border:none;max-width:200px}
.fchip:hover{background:#ddd6f8}
.fchip.sub{background:var(--blu-l);color:var(--blu)}
.fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
.fdl{opacity:.5;font-size:14px;cursor:pointer}
.fdl:hover{opacity:1}
.frow{display:flex;flex-wrap:wrap;margin-top:6px;align-items:center}
.uz{border:2px dashed var(--bdr2);border-radius:var(--r);padding:1rem;text-align:center;cursor:pointer;transition:all .15s;background:var(--surf3);display:block;margin-top:8px}
.uz:hover,.uz.dg{border-color:var(--acc);background:var(--acc-l)}
.uz p{font-size:13px;color:var(--mut);pointer-events:none}
.uz p strong{color:var(--acc)}
.sh{font-size:20px;font-weight:700;margin-bottom:1rem;letter-spacing:-0.3px}
.loading{text-align:center;padding:4rem;color:var(--mut);font-size:14px}
.row-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}

/* QUESTION HUB */
.subj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:1.5rem}
.subj-card{background:var(--surf);border:1.5px solid var(--bdr);border-radius:var(--r);padding:1.25rem;cursor:pointer;transition:all .2s;text-align:center}
.subj-card:hover{border-color:var(--acc);box-shadow:var(--shm);transform:translateY(-2px)}
.subj-card.on{border-color:var(--acc);background:var(--acc-l)}
.subj-emoji{font-size:28px;margin-bottom:.5rem}
.subj-name{font-size:14px;font-weight:700;color:var(--txt)}
.subj-desc{font-size:12px;color:var(--mut);margin-top:2px}
.year-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:1.25rem}
.ytab{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--bdr2);background:var(--surf);color:var(--mut);transition:all .15s}
.ytab.on{background:var(--acc);color:white;border-color:var(--acc)}
.q-card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:1.25rem;margin-bottom:.75rem;box-shadow:var(--sh)}
.q-num{font-size:11px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.4rem}
.q-text{font-size:14px;font-weight:500;line-height:1.6;color:var(--txt)}
.q-meta{display:flex;gap:8px;margin-top:.6rem;flex-wrap:wrap}
.q-ans{background:var(--grn-l);border:1px solid #a8dcc2;border-radius:var(--rs);padding:.75rem 1rem;margin-top:.75rem;font-size:13px;color:var(--grn);display:none}
.q-ans.show{display:block}
.q-actions{display:flex;gap:6px;margin-top:.75rem;flex-wrap:wrap}
.topic-select{padding:8px 12px;border:1.5px solid var(--bdr);border-radius:var(--rs);font-size:13px;background:var(--surf3);color:var(--txt);outline:none;cursor:pointer}
.topic-select:focus{border-color:var(--acc)}
.ai-generating{text-align:center;padding:2rem;color:var(--mut)}
.spin{width:28px;height:28px;border:3px solid var(--bdr2);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto .75rem}
@keyframes spin{to{transform:rotate(360deg)}}

/* SCHEDULE */
.sched-wrap{overflow-x:auto;border:1px solid var(--bdr);border-radius:var(--r);background:var(--surf);box-shadow:var(--sh)}
.sched-table{border-collapse:collapse;width:100%;min-width:700px;font-size:13px}
.sched-table th{background:var(--surf2);font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;padding:10px 12px;border:1px solid var(--bdr);text-align:center;white-space:nowrap}
.sched-table th.time-col{width:70px;min-width:70px}
.sched-table th.day-col{min-width:120px}
.sched-table td{border:1px solid var(--bdr);padding:0;vertical-align:top;height:48px;position:relative}
.sched-table td.time-cell{background:var(--surf2);padding:0 10px;font-size:11px;font-weight:600;color:var(--mut);font-family:var(--mono);text-align:right;vertical-align:middle;white-space:nowrap}
.sched-cell{width:100%;height:100%;min-height:48px;padding:5px 7px;cursor:pointer;transition:background .1s;display:flex;align-items:flex-start;gap:4px}
.sched-cell:hover{background:var(--acc-l)}
.sched-cell.has-event{background:var(--acc-l);cursor:pointer}
.sched-cell.has-event:hover{background:#ddd6f8}
.sched-event{flex:1;min-width:0}
.sched-event-title{font-size:12px;font-weight:600;color:var(--acc);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sched-event-sub{font-size:11px;color:var(--mut);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sched-del{font-size:14px;color:var(--mut);opacity:0;transition:opacity .1s;flex-shrink:0;cursor:pointer;line-height:1;padding:1px 2px;border-radius:3px}
.sched-del:hover{background:var(--dan-l);color:var(--dan);opacity:1!important}
.sched-cell.has-event:hover .sched-del{opacity:.5}
.sched-today th.today-col{background:var(--acc-l);color:var(--acc)}
.sched-color-0{background:var(--acc-l)!important}.sched-color-0 .sched-event-title{color:var(--acc)}
.sched-color-1{background:var(--blu-l)!important}.sched-color-1 .sched-event-title{color:var(--blu)}
.sched-color-2{background:var(--grn-l)!important}.sched-color-2 .sched-event-title{color:var(--grn)}
.sched-color-3{background:var(--amb-l)!important}.sched-color-3 .sched-event-title{color:var(--amb)}
.sched-color-4{background:var(--dan-l)!important}.sched-color-4 .sched-event-title{color:var(--dan)}
.color-dots{display:flex;gap:6px;align-items:center}
.color-dot{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s}
.color-dot.on{border-color:var(--txt);transform:scale(1.15)}

/* PAPER ANALYSER */
.paper-drop{border:2px dashed var(--bdr2);border-radius:var(--r);padding:2.5rem 1rem;text-align:center;cursor:pointer;transition:all .15s;background:var(--surf3);display:block;width:100%}
.paper-drop:hover,.paper-drop.dg{border-color:var(--acc);background:var(--acc-l)}
.paper-drop-icon{font-size:36px;margin-bottom:.75rem}
.paper-drop p{font-size:14px;color:var(--mut)}
.paper-drop p strong{color:var(--acc)}
.paper-drop input{display:none}
.topic-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;background:var(--acc-l);color:var(--acc);font-size:12px;font-weight:600;margin:3px;border:1.5px solid transparent;cursor:pointer;transition:all .15s}
.topic-chip:hover{border-color:var(--acc)}
.topic-chip.on{background:var(--acc);color:white}
.pa-step{display:none}.pa-step.on{display:block}
.pa-q-card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:1.25rem;margin-bottom:.85rem;box-shadow:var(--sh)}
.pa-q-num{font-size:11px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.4rem}
.pa-q-text{font-size:14px;font-weight:600;line-height:1.6;margin-bottom:.75rem}
.pa-answer-area{width:100%;padding:10px 14px;border:1.5px solid var(--bdr);border-radius:var(--rs);font-size:14px;background:var(--surf3);color:var(--txt);outline:none;resize:vertical;min-height:80px;transition:border-color .15s;font-family:var(--font)}
.pa-answer-area:focus{border-color:var(--acc);background:var(--surf);box-shadow:0 0 0 4px rgba(91,75,212,.1)}
.pa-feedback{border-radius:var(--rs);padding:1rem 1.1rem;margin-top:.75rem;font-size:13px;display:none;line-height:1.6}
.pa-feedback.show{display:block}
.pa-feedback.pass{background:var(--grn-l);border:1px solid #a8dcc2;color:#145c3a}
.pa-feedback.fail{background:var(--dan-l);border:1px solid #f0b8cc;color:var(--dan)}
.pa-feedback.neutral{background:var(--acc-l);border:1px solid var(--bdr2);color:var(--txt)}
.pa-mark{font-size:20px;font-weight:700;margin-bottom:6px}
.pa-score-bar{height:6px;background:var(--surf2);border-radius:99px;overflow:hidden;margin:1rem 0 .4rem}
.pa-score-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .6s ease}
.pa-progress{font-size:12px;color:var(--mut);text-align:right;margin-bottom:1.25rem}

/* PAPER ANALYSER */
.paper-overlay{position:fixed;inset:0;background:rgba(10,8,25,.55);z-index:300;display:none;align-items:flex-start;justify-content:center;padding:2rem 1rem;overflow-y:auto}
.paper-overlay.open{display:flex}
.paper-modal{background:var(--surf);border-radius:18px;width:100%;max-width:680px;box-shadow:var(--shm);border:1px solid var(--bdr2);margin:auto}
.paper-hdr{display:flex;align-items:center;justify-content:space-between;padding:1.5rem 1.75rem 0}
.paper-hdr h2{font-size:18px;font-weight:700;letter-spacing:-.3px}
.paper-close{width:32px;height:32px;border-radius:8px;border:none;background:none;cursor:pointer;color:var(--mut);font-size:20px;display:flex;align-items:center;justify-content:center;transition:background .12s}
.paper-close:hover{background:var(--surf2)}
.paper-body{padding:1.5rem 1.75rem 1.75rem}

// ── DATE ─────────────────────────────────────────────────────────
function todayKey(){return new Date().toISOString().split('T')[0];}
function weekKey(ds){return ds||todayKey();}
function shiftWeek(ds,dir){const d=new Date((ds||todayKey())+'T00:00:00');d.setDate(d.getDate()+dir*7);return d.toISOString().split('T')[0];}

// ── SOUND & FEEDBACK ─────────────────────────────────────────────
function playTick(){
  // Soft click tone for nav transitions
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.connect(gain);gain.connect(ctx.destination);
    osc.type='sine';osc.frequency.value=600;
    gain.gain.setValueAtTime(0,ctx.currentTime);
    gain.gain.linearRampToValueAtTime(.06,ctx.currentTime+.01);
    gain.gain.linearRampToValueAtTime(0,ctx.currentTime+.08);
    osc.start(ctx.currentTime);osc.stop(ctx.currentTime+.09);
  }catch{}
}

function playDone(){
  // Clean two-note chime for task completion
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [[523,.0,.12],[784,.1,.12]].forEach(([freq,delay,dur])=>{
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.connect(gain);gain.connect(ctx.destination);
      osc.type='sine';osc.frequency.value=freq;
      gain.gain.setValueAtTime(0,ctx.currentTime+delay);
      gain.gain.linearRampToValueAtTime(.1,ctx.currentTime+delay+.01);
      gain.gain.linearRampToValueAtTime(0,ctx.currentTime+delay+dur);
      osc.start(ctx.currentTime+delay);osc.stop(ctx.currentTime+delay+dur+.01);
    });
  }catch{}
}

function launchRipple(x,y){
  const el=document.createElement('div');
  el.className='ripple-ring';
  el.style.left=x+'px';el.style.top=y+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),520);
}

function celebrateTask(chkEl){
  const rect=chkEl.getBoundingClientRect();
  launchRipple(rect.left+rect.width/2,rect.top+rect.height/2);
  playDone();
  chkEl.classList.add('pop');
  setTimeout(()=>chkEl.classList.remove('pop'),400);
}

// ── POMODORO ─────────────────────────────────────────────────────
let pomoTotal=25*60,pomoLeft=25*60,pomoRunning=false,pomoInterval=null;
function setPomoMode(mins,btn){
  clearInterval(pomoInterval);pomoRunning=false;pomoTotal=mins*60;pomoLeft=mins*60;
  document.getElementById('pomo-start').textContent='Start';
  document.getElementById('pomo-start').classList.add('active');
  document.querySelectorAll('.pomo-mode').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');renderPomo();
}
function togglePomo(){
  if(pomoRunning){
    clearInterval(pomoInterval);pomoRunning=false;
    document.getElementById('pomo-start').textContent='Resume';
    document.getElementById('pomo-start').classList.remove('active');
  } else {
    pomoRunning=true;
    document.getElementById('pomo-start').textContent='Pause';
    document.getElementById('pomo-start').classList.add('active');
    pomoInterval=setInterval(()=>{
      if(pomoLeft<=0){clearInterval(pomoInterval);pomoRunning=false;playDone();alert("Time's up! Take a break 🎉");document.getElementById('pomo-start').textContent='Start';document.getElementById('pomo-start').classList.add('active');return;}
      pomoLeft--;renderPomo();
    },1000);
  }
}
function resetPomo(){clearInterval(pomoInterval);pomoRunning=false;pomoLeft=pomoTotal;document.getElementById('pomo-start').textContent='Start';document.getElementById('pomo-start').classList.add('active');renderPomo();}
function renderPomo(){const m=Math.floor(pomoLeft/60),s=pomoLeft%60;document.getElementById('pomo-time').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;document.getElementById('pomo-fill').style.width=(pomoLeft/pomoTotal*100)+'%';}

  enterApp(data);
}
async function doReg(){
  hideErr('reg-err');
  const name=document.getElementById('r-name').value.trim(),email=document.getElementById('r-email').value.trim(),pass=document.getElementById('r-pass').value;

function viewClientSched(clientId, clientName){
  // Read their schedule from localStorage (keyed by client id)
  const raw=localStorage.getItem('flow_sched_'+clientId)||localStorage.getItem('flow_sched')||'{}';
  const events=JSON.parse(raw);
  const keys=Object.keys(events);
  document.getElementById('m-title').textContent=`${clientName}'s Schedule`;
  if(!keys.length){
    document.getElementById('m-body').innerHTML=`<p style="color:var(--mut);font-size:14px">No schedule events saved yet.</p>`;
  } else {
    const dayOrder=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
    const COLORS_BG=['var(--acc-l)','var(--blu-l)','var(--grn-l)','var(--amb-l)','var(--dan-l)'];
    const COLORS_TXT=['var(--acc)','var(--blu)','var(--grn)','var(--amb)','var(--dan)'];
    const sorted=keys.sort((a,b)=>{
      const [da,ha]=a.split('_');const [db,hb]=b.split('_');
      return (dayOrder.indexOf(da)-dayOrder.indexOf(db))||parseInt(ha)-parseInt(hb);
    });
    let h=`<div style="display:flex;flex-direction:column;gap:6px;max-height:420px;overflow-y:auto">`;
    sorted.forEach(k=>{
      const ev=events[k];
      const [day,hourStr]=k.split('_');
      const hour=parseInt(hourStr);
      const label=hour<12?`${hour}:00 AM`:hour===12?`12:00 PM`:`${hour-12}:00 PM`;
      const bg=COLORS_BG[ev.color||0];const tc=COLORS_TXT[ev.color||0];
      h+=`<div style="display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:var(--rs);background:${bg}">
        <div style="font-size:11px;font-weight:700;color:${tc};min-width:90px">${day} ${label}</div>
        <div style="flex:1"><div style="font-size:13px;font-weight:600;color:${tc}">${esc(ev.title)}</div>${ev.note?`<div style="font-size:12px;opacity:.75">${esc(ev.note)}</div>`:''}</div>
      </div>`;
    });
    h+=`</div>`;
    document.getElementById('m-body').innerHTML=h;
  }
  document.getElementById('m-actions').innerHTML=`<button class="btn btn-s" onclick="closeModal()">Close</button>`;
  document.getElementById('modal-overlay').style.display='flex';
}

async function toggleTask(tid,wk,isDone,chkEl){
  // Optimistic DOM update — no full re-render
  const nowDone=!isDone;
  if(nowDone){
    celebrateTask(chkEl);
    chkEl.classList.add('on');
    chkEl.innerHTML='<svg width="11" height="8" viewBox="0 0 11 8"><path d="M1 4l3 3 6-6" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  } else {
    chkEl.classList.remove('on');
    chkEl.innerHTML='';
  }
  // Update title strikethrough
  const row=chkEl.closest('.ti');
  if(row){
    const ttl=row.querySelector('.ttl');
    if(ttl){ttl.classList.toggle('dn',nowDone);}
    // Update done tag
    const meta=row.querySelector('.tmeta');
    if(meta){
      const existing=meta.querySelector('.tg');
      if(nowDone&&!existing){const t=document.createElement('span');t.className='tag tg';t.textContent='✓ Done';meta.appendChild(t);}
      else if(!nowDone&&existing){existing.remove();}
    }
  }
  // Update progress bar & counter
  const card=chkEl.closest('.card');
  if(card){
    const allChks=card.querySelectorAll('.chk');
    const doneCount=card.querySelectorAll('.chk.on').length;
    const total=allChks.length;
    const pfill=document.getElementById('client-pfill');
    if(pfill){pfill.style.width=(total?Math.round(doneCount/total*100):0)+'%';}
    const counter=card.querySelector('[data-counter]');
    if(counter){counter.textContent=`${doneCount} / ${total} done`;}
  }
  // Persist to DB
  if(nowDone){await sb.from('completions').upsert({client_id:CU.id,week_key:wk,task_id:tid,done:true});}
  else{await sb.from('completions').delete().eq('client_id',CU.id).eq('week_key',wk).eq('task_id',tid);}
}

function getQuestions(subject,year,topic){
  const bank=QUESTION_BANK[subject]?.[year]?.[topic];
  if(!bank||!bank.length)return null;
  // shuffle to vary each time
  return [...bank].sort(()=>Math.random()-.5);
}

function detectSubject(text){
  const lower = text.toLowerCase();
  let best = null, bestCount = 0;
  for(const [subj, kws] of Object.entries(SUBJ_KEYWORDS)){
    const count = kws.filter(k => lower.includes(k)).length;
    if(count > bestCount){bestCount = count; best = subj;}
  }
  return bestCount > 0 ? best : 'maths'; // default fallback
}

// Attempt to detect year level from text
function detectYear(text){
  const m = text.match(/year\s*(7|8|9|10|11|12)/i) || text.match(/grade\s*(7|8|9|10|11|12)/i) || text.match(/\b(7|8|9|10|11|12)\b/);
  if(m){
    const y = parseInt(m[1]);
    if(y>=7&&y<=12) return y;
  }
  return 11; // default
}

// Extract lines that look like questions from plain text
function extractQuestionsFromText(text){
  const lines = text.split(/\n/).map(l=>l.trim()).filter(l=>l.length>10);
  const questions = [];

  // Patterns that indicate a question
  const qPatterns = [
    /^\(?[a-zA-Z0-9]{1,2}[\)\.]\s+.+\?/,      // (a) ... ?  or  a. ... ?
    /^(q|question)\s*\d+[\.:)]/i,               // Q1. / Question 1:
    /^\d+[\)\.]\s+[A-Z].{10,}/,                  // 1. Capital letter sentence
    /^(explain|describe|calculate|find|determine|evaluate|analyse|analyze|compare|discuss|what|how|why|when|which|state|define|outline|show|prove|solve|simplify|expand|factorise|differentiate|integrate|draw|sketch|list|identify|justify|assess|examine|suggest|predict)/i
  ];

  // Answer-like follow-up lines
  const answerHints = /^(answer|solution|model answer|ans|key|marking)[\s:]/i;

  let i = 0;
  while(i < lines.length){
    const line = lines[i];
    const isQ = qPatterns.some(p => p.test(line));
    if(isQ && line.length > 15){
      // Try to find an answer on the next few lines
      let answer = '';
      let j = i+1;
      while(j < lines.length && j < i+4){
        if(answerHints.test(lines[j])){
          answer = lines[j].replace(answerHints,'').trim();
          break;
        }
        j++;
      }
      // Estimate marks from any number in parentheses like (3 marks) or [2]
      const marksMatch = line.match(/\((\d+)\s*marks?\)/i) || line.match(/\[(\d+)\]/);
      const marks = marksMatch ? parseInt(marksMatch[1]) : (line.length > 120 ? 4 : line.length > 60 ? 2 : 1);

      questions.push({
        question: line.replace(/\(\d+\s*marks?\)/gi,'').replace(/\[\d+\]/g,'').trim(),
        answer: answer || 'See model answer in original paper.',
        marks: Math.min(Math.max(marks,1),8),
        difficulty: marks >= 4 ? 'Hard' : marks >= 2 ? 'Medium' : 'Easy'
      });
    }
    i++;
  }
  return questions;
}

// Read a plain text file
function readTextFile(file){
  return new Promise((resolve,reject)=>{
    const fr = new FileReader();
    fr.onload = e => resolve(e.target.result);
    fr.onerror = reject;
    fr.readAsText(file);
  });
}

      <p style="font-size:12px;margin-top:4px">Questions, year level and subject are detected automatically</p>
    </label>
  </div>`;

  if(paperHubData.length){
    // Group by subject
    const bySubj = {};
    paperHubData.forEach(p=>{
      if(!bySubj[p.subject]) bySubj[p.subject]=[];
      bySubj[p.subject].push(p);
    });
    const subjNames = {maths:'Mathematics',physics:'Physics',chemistry:'Chemistry',biology:'Biology',english:'English'};
    const subjEmoji = {maths:'🧮',physics:'⚛️',chemistry:'🧪',biology:'🧬',english:'📚'};

    for(const [subj, papers] of Object.entries(bySubj)){
      const totalQs = papers.reduce((a,p)=>a+p.questions.length,0);
      h+=`<div class="card" style="margin-bottom:1rem">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font-size:22px">${subjEmoji[subj]||'📄'}</span>
            <div>
              <div style="font-weight:700;font-size:15px">${subjNames[subj]||subj}</div>
              <div style="font-size:12px;color:var(--mut)">${papers.length} paper${papers.length>1?'s':''} · ${totalQs} question${totalQs>1?'s':''} extracted</div>
            </div>
          </div>
          <button class="btn btn-p btn-sm" style="width:auto" onclick="injectToQHub('${subj}')">→ Open in Question Hub</button>
        </div>`;
      papers.forEach(p=>{
        h+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--bdr)">
          <div>
            <div style="font-size:13px;font-weight:600">${esc(p.name)}</div>
            <div style="font-size:12px;color:var(--mut)">Year ${p.year} · ${p.questions.length} questions · Added ${new Date(p.addedAt).toLocaleDateString('en-AU',{day:'numeric',month:'short'})}</div>
          </div>
          <div style="display:flex;gap:6px">
            <button class="btn btn-s btn-sm" onclick="previewPaper('${p.id}')">Preview</button>
            <button class="btn btn-d btn-sm" onclick="deletePaper('${p.id}')">Delete</button>
          </div>
        </div>`;
      });
      h+=`</div>`;
    }
  } else {
    h+=`<div class="empty"><div class="empty-i">📂</div><div class="empty-t">No papers uploaded yet</div><p>Upload a .txt file above to get started</p></div>`;
  }
  el.innerHTML = h;
}

function handlePaperDrop2(e){
  e.preventDefault();
  handlePaperFiles(e.dataTransfer.files);
}

async function handlePaperFiles(files){
  let added = 0;
  for(const file of Array.from(files)){
    if(!file.name.endsWith('.txt') && file.type !== 'text/plain'){
      alert(`"${file.name}" is not a .txt file. Please save your paper as plain text first.`);
      continue;
    }
    try{
      const text = await readTextFile(file);
      const subject = detectSubject(text);
      const year = detectYear(text);
      const questions = extractQuestionsFromText(text);
      if(!questions.length){
        alert(`No questions found in "${file.name}". Make sure the file contains numbered or clearly formatted questions.`);
        continue;
      }
      // Find a matching topic or use filename as topic
      const topicName = file.name.replace(/\.txt$/i,'').replace(/_/g,' ');
      paperHubData.push({
        id: gid(),
        name: file.name,
        subject,
        year,
        topic: topicName,
        questions,
        addedAt: Date.now()
      });
      added++;
    }catch(e){
      alert(`Could not read "${file.name}": ${e.message}`);
    }
  }
  if(added > 0){
    savePaperHubData();
    renderPaperHub();
    // Show success banner
    const el = document.getElementById('paper-view');
    const banner = document.createElement('div');
    banner.style.cssText='position:fixed;top:80px;right:24px;background:var(--grn-l);color:var(--grn);border:1px solid #a8dcc2;border-radius:var(--rs);padding:12px 18px;font-size:13px;font-weight:600;z-index:999;box-shadow:var(--sh)';
    banner.textContent = `✓ ${added} paper${added>1?'s':''} uploaded and questions extracted!`;
    document.body.appendChild(banner);
    setTimeout(()=>banner.remove(), 3500);
  }
}

function deletePaper(id){
  if(!confirm('Remove this paper?')) return;
  paperHubData = paperHubData.filter(p=>p.id!==id);
  savePaperHubData();
  renderPaperHub();
}

function previewPaper(id){
  const p = paperHubData.find(x=>x.id===id);
  if(!p) return;
  const subjNames = {maths:'Mathematics',physics:'Physics',chemistry:'Chemistry',biology:'Biology',english:'English'};
  document.getElementById('m-title').textContent = `${p.name} — ${p.questions.length} questions`;
  let h = `<p style="font-size:12px;color:var(--mut);margin-bottom:1rem">Subject: <strong>${subjNames[p.subject]||p.subject}</strong> · Year ${p.year}</p>`;
  p.questions.slice(0,8).forEach((q,i)=>{
    h+=`<div style="padding:10px 0;border-bottom:1px solid var(--bdr)">
      <div style="font-size:11px;font-weight:700;color:var(--acc);margin-bottom:3px">Q${i+1} · ${q.marks} mark${q.marks>1?'s':''} · ${q.difficulty}</div>
      <div style="font-size:13px;font-weight:500">${esc(q.question)}</div>
    </div>`;
  });
  if(p.questions.length>8) h+=`<p style="font-size:12px;color:var(--mut);margin-top:.75rem">...and ${p.questions.length-8} more questions</p>`;
  document.getElementById('m-body').innerHTML = h;
  document.getElementById('m-actions').innerHTML = `<button class="btn btn-s" onclick="closeModal()">Close</button><button class="btn btn-p" style="width:auto" onclick="injectToQHub('${p.subject}');closeModal()">→ Open in Question Hub</button>`;
  document.getElementById('modal-overlay').style.display='flex';
}

function injectToQHub(subject){
  // Gather all questions for this subject from paperHubData
  const papers = paperHubData.filter(p=>p.subject===subject);
  if(!papers.length) return;
  // Pick the most recent paper's topic, or use the first one
  const paper = papers[papers.length-1];
  // Pre-load qState with the subject, year and questions then navigate to Q-Hub
  qState.subject = subject;
  qState.year = paper.year;
  qState.topic = paper.topic;
  // Merge all questions from all papers of this subject
  qState.questions = papers.flatMap(p=>p.questions);
  qState.customQs = [];
  qState.showCustomForm = false;
  showQHub();
}


// ── SCHEDULE ─────────────────────────────────────────────────────
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const HOURS=Array.from({length:16},(_,i)=>i+7);
const COLORS=['#ECEAFA','#E3EDF8','#E3F6EE','#FBF3E3','#FCEEF2'];
const COLOR_LABELS=['Purple','Blue','Green','Amber','Red'];
let schedEvents=JSON.parse(localStorage.getItem('flow_sched')||'{}');
let schedPickColor=0;

function saveSched(){
  const key=CU?'flow_sched_'+CU.id:'flow_sched';
  localStorage.setItem(key,JSON.stringify(schedEvents));
}
function schedKey(day,hour){return `${day}_${hour}`;}

function renderSched(){
  const el=document.getElementById('sched-view');
  const today=new Date().getDay();
  const todayIdx=today===0?6:today-1;
  // Store schedule under user-specific key so admin can read it
  const schedKey2=CU?'flow_sched_'+CU.id:'flow_sched';
  if(CU&&!schedEvents._migrated){
    // One-time migrate generic key to user key if exists
    const generic=localStorage.getItem('flow_sched');
    if(generic&&!localStorage.getItem(schedKey2)){localStorage.setItem(schedKey2,generic);}
    schedEvents._migrated=true;
  }
  const privKey=CU?'sched_private_'+CU.id:'sched_private';
  const isPrivate=localStorage.getItem(privKey)==='1';
  const isClient=CU&&CU.role==='client';

  let h=`<div class="row-top"><span class="sh" style="margin:0">Weekly Schedule</span>
    <div style="display:flex;gap:8px;align-items:center">`;
  if(isClient){
    h+=`<label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);cursor:pointer">
      <input type="checkbox" id="sched-priv-toggle" ${isPrivate?'checked':''} onchange="toggleSchedPrivacy(this.checked)" style="accent-color:var(--acc)">
      Hide from coach
    </label>`;
  }
  h+=`<button class="btn btn-p btn-sm" style="width:auto" onclick="openAddEvent()">+ Add event</button>
    </div>
  </div>
  <p style="font-size:13px;color:var(--mut);margin-bottom:1.25rem">Click any cell to add an event, or use the button above.${isPrivate?' <strong style="color:var(--amb)">🔒 Your schedule is hidden from your coach.</strong>':''}</p>
  <div class="sched-wrap"><table class="sched-table sched-today"><thead><tr><th class="time-col">Time</th>`;
  DAYS.forEach((d,i)=>{h+=`<th class="day-col${i===todayIdx?' today-col':''}">${d}</th>`;});
  h+=`</tr></thead><tbody>`;
  HOURS.forEach(hour=>{
    const label=hour<12?`${hour}:00 AM`:hour===12?`12:00 PM`:`${hour-12}:00 PM`;
    h+=`<tr><td class="time-cell">${label}</td>`;
    DAYS.forEach(day=>{
      const key=schedKey(day,hour);
      const ev=schedEvents[key];
      if(ev){
        h+=`<td><div class="sched-cell has-event sched-color-${ev.color}" onclick="openEditEvent('${key}')">
          <div class="sched-event">
            <div class="sched-event-title">${esc(ev.title)}</div>
            ${ev.note?`<div class="sched-event-sub">${esc(ev.note)}</div>`:''}
          </div>
          <span class="sched-del" onclick="event.stopPropagation();deleteEvent('${key}')" title="Delete">×</span>
        </div></td>`;
      } else {
        h+=`<td><div class="sched-cell" onclick="openAddEventAt('${day}',${hour})"></div></td>`;
      }
    });
    h+=`</tr>`;
  });
  h+=`</tbody></table></div>`;
  el.innerHTML=h;
}

function toggleSchedPrivacy(hide){
  const privKey=CU?'sched_private_'+CU.id:'sched_private';
  if(hide){localStorage.setItem(privKey,'1');}
  else{localStorage.removeItem(privKey);}
  renderSched();
}

function openAddEvent(){
  document.getElementById('m-title').textContent='Add event';
  _schedModalBody();
  document.getElementById('m-actions').innerHTML=`<button class="btn btn-s" onclick="closeModal()">Cancel</button><button class="btn btn-p" style="width:auto" onclick="saveSchedEvent()">Add event</button>`;
  document.getElementById('modal-overlay').style.display='flex';
}
function openAddEventAt(day,hour){
  document.getElementById('m-title').textContent='Add event';
  _schedModalBody(day,hour);
  document.getElementById('m-actions').innerHTML=`<button class="btn btn-s" onclick="closeModal()">Cancel</button><button class="btn btn-p" style="width:auto" onclick="saveSchedEvent()">Add event</button>`;
  document.getElementById('modal-overlay').style.display='flex';
}
function openEditEvent(key){
  const ev=schedEvents[key];if(!ev)return;
  const [day,hourStr]=key.split('_');
  document.getElementById('m-title').textContent='Edit event';
  _schedModalBody(day,parseInt(hourStr),ev);
  document.getElementById('m-actions').innerHTML=`<button class="btn btn-d btn-sm" onclick="deleteEvent('${key}');closeModal()">Delete</button><div style="flex:1"></div><button class="btn btn-s" onclick="closeModal()">Cancel</button><button class="btn btn-p" style="width:auto" onclick="saveSchedEvent('${key}')">Save</button>`;
  document.getElementById('modal-overlay').style.display='flex';
}
function _schedModalBody(day,hour,ev){
  const colorDots=COLORS.map((c,i)=>`<div class="color-dot${(ev?ev.color:schedPickColor)===i?' on':''}" style="background:${c};border:2px solid ${(ev?ev.color:schedPickColor)===i?'#555':'var(--bdr2)'}" onclick="document.querySelectorAll('.color-dot').forEach((d,j)=>{d.classList.toggle('on',j===${i});d.style.borderColor=j===${i}?'#555':'var(--bdr2)'});schedPickColor=${i}" title="${COLOR_LABELS[i]}"></div>`).join('');
  document.getElementById('m-body').innerHTML=`
    <div class="field"><label>Title</label><input id="sc-title" placeholder="e.g. Maths study" value="${ev?esc(ev.title):''}"/></div>
    <div class="field"><label>Note (optional)</label><input id="sc-note" placeholder="e.g. Chapter 3" value="${ev?esc(ev.note||''):''}"/></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="field"><label>Day</label><select id="sc-day">${DAYS.map(d=>`<option value="${d}"${d===(day||'Monday')?' selected':''}>${d}</option>`).join('')}</select></div>
      <div class="field"><label>Time</label><select id="sc-hour">${HOURS.map(h=>{const l=h<12?`${h}:00 AM`:h===12?`12:00 PM`:`${h-12}:00 PM`;return`<option value="${h}"${h===(hour||9)?' selected':''}>${l}</option>`;}).join('')}</select></div>
    </div>
    <div class="field"><label>Colour</label><div class="color-dots">${colorDots}</div></div>`;
}
function saveSchedEvent(editKey){
  const title=document.getElementById('sc-title').value.trim();
  if(!title)return alert('Please enter a title.');
  const day=document.getElementById('sc-day').value;
  const hour=parseInt(document.getElementById('sc-hour').value);
  const note=document.getElementById('sc-note').value.trim();
  const dots=document.querySelectorAll('.color-dot');
  let color=schedPickColor;
  dots.forEach((d,i)=>{if(d.classList.contains('on'))color=i;});
  if(editKey)delete schedEvents[editKey];
  schedEvents[schedKey(day,hour)]={title,note,color};
  saveSched();closeModal();renderSched();
}
function deleteEvent(key){delete schedEvents[key];saveSched();renderSched();}

// ── INIT ─────────────────────────────────────────────────────────
async function init(){
  const saved=localStorage.getItem('flow_session');
  if(saved){try{enterApp(JSON.parse(saved));return;}catch{}}
  document.getElementById('auth-screen').style.display='';
  const hasAdmin=await isAdminSetup();
  if(!hasAdmin){document.getElementById('setup-view').style.display='';}
  else{document.getElementById('login-view').style.display='';}
}
init();
</script>
