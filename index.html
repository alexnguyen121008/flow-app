<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0EEF8;--surf:#fff;--surf2:#E8E4F5;--surf3:#F5F3FB;
  --bdr:#DDD8EE;--bdr2:#C8C2E0;
  --txt:#1A1730;--mut:#706C8A;
  --acc:#5B4BD4;--acc-l:#ECEAFA;--acc2:#7B68E8;
  --dan:#C0385A;--dan-l:#FCEEF2;
  --amb:#A06820;--amb-l:#FBF3E3;
  --blu:#2E6BA8;--blu-l:#E3EDF8;
  --grn:#1A7A50;--grn-l:#E3F6EE;
  --r:12px;--rs:8px;
  --sh:0 1px 4px rgba(0,0,0,.06),0 4px 16px rgba(91,75,212,.08);
  --shm:0 8px 32px rgba(91,75,212,.15);
  --font:'Inter',system-ui,sans-serif;--mono:monospace;
}
body{font-family:var(--font);background:var(--bg);color:var(--txt);font-size:15px;line-height:1.6;min-height:100vh}
input,select,textarea,button{font-family:var(--font)}
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:var(--bg)}
.auth-card{background:var(--surf);border:1px solid var(--bdr);border-radius:20px;padding:2.75rem;width:100%;max-width:420px;box-shadow:var(--shm)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:2rem}
.brand-ic{width:38px;height:38px;background:linear-gradient(135deg,var(--acc),var(--acc2));border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(91,75,212,.3)}
.brand-ic svg{width:20px;height:20px;fill:white}
.brand-name{font-size:20px;font-weight:700;letter-spacing:-0.3px}
h2.auth-title{font-size:24px;font-weight:700;margin-bottom:4px;letter-spacing:-0.4px}
.auth-sub{font-size:14px;color:var(--mut);margin-bottom:1.75rem}
.field{margin-bottom:1.1rem}
.field label{display:block;font-size:11px;font-weight:700;margin-bottom:6px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.field input,.field select,.field textarea{width:100%;padding:11px 14px;border:1.5px solid var(--bdr);border-radius:var(--rs);font-size:15px;background:var(--surf3);color:var(--txt);outline:none;transition:all .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--acc);background:var(--surf);box-shadow:0 0 0 4px rgba(91,75,212,.1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:var(--rs);font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid transparent;transition:all .15s;background:none;color:var(--txt)}
.btn-p{background:linear-gradient(135deg,var(--acc),var(--acc2));color:white;width:100%;padding:12px;font-size:15px;border:none;box-shadow:0 4px 12px rgba(91,75,212,.3)}
.btn-p:hover{opacity:.9;transform:translateY(-1px)}
.btn-s{background:var(--surf);color:var(--txt);border-color:var(--bdr2)}
.btn-s:hover{background:var(--surf2);border-color:var(--acc)}
.btn-d{background:var(--dan-l);color:var(--dan);border-color:transparent}
.btn-d:hover{background:#f9d8e2}
.btn-sm{padding:6px 14px;font-size:13px}
.toggle{text-align:center;margin-top:1.25rem;font-size:13px;color:var(--mut)}
.toggle a{color:var(--acc);cursor:pointer;font-weight:600}
.err{background:var(--dan-l);color:var(--dan);border:1.5px solid #f0b8cc;border-radius:var(--rs);padding:10px 14px;font-size:13px;margin-bottom:1rem;display:none}
#app{display:none;min-height:100vh}
.hdr{background:var(--surf);border-bottom:1px solid var(--bdr);padding:0 1.5rem;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--sh)}
.hdr-r{display:flex;align-items:center;gap:.75rem}
.ubadge{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut)}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));color:white;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.rtag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--amb-l);color:var(--amb);letter-spacing:.3px;text-transform:uppercase}
.rtag.cl{background:var(--blu-l);color:var(--blu)}
.app-body{display:flex;min-height:calc(100vh - 64px)}
.sidebar{width:230px;flex-shrink:0;background:var(--surf);border-right:1px solid var(--bdr);padding:1.25rem 1rem;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--rs);font-size:14px;font-weight:500;color:var(--mut);cursor:pointer;transition:all .15s;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--surf2);color:var(--txt)}
.nav-item.on{background:var(--acc-l);color:var(--acc);font-weight:600}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.nav-sep{height:1px;background:var(--bdr);margin:8px 0}
.nav-label{font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.7px;padding:4px 12px;margin-top:4px}
.content{flex:1;padding:2rem;overflow-y:auto;min-width:0}

/* POMODORO */
.pomo-widget{background:var(--surf3);border:1px solid var(--bdr);border-radius:var(--r);padding:1rem;margin-bottom:.75rem;text-align:center}
.pomo-label{font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin-bottom:.6rem}
.pomo-modes{display:flex;gap:3px;justify-content:center;margin-bottom:.6rem}
.pomo-mode{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--bdr2);background:none;color:var(--mut);transition:all .15s}
.pomo-mode.on{background:var(--acc-l);color:var(--acc);border-color:var(--acc)}
.pomo-time{font-size:34px;font-weight:700;letter-spacing:-1px;color:var(--txt);font-family:var(--mono);line-height:1.1}
.pomo-bar{height:4px;background:var(--surf2);border-radius:99px;margin:.6rem 0;overflow:hidden}
.pomo-fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .5s linear}
.pomo-btns{display:flex;gap:5px;justify-content:center}
.pomo-btn{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--bdr2);background:var(--surf);color:var(--mut);transition:all .15s}
.pomo-btn:hover{background:var(--acc-l);border-color:var(--acc);color:var(--acc)}
.pomo-btn.active{background:linear-gradient(135deg,var(--acc),var(--acc2));color:white;border-color:transparent}

/* CARDS */
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:1.5rem;box-shadow:var(--sh);margin-bottom:1rem}
.ci{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--bdr)}
.ci:last-child{border-bottom:none}
.ci-info{display:flex;align-items:center;gap:10px}
.ti{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--bdr)}
.ti:last-child{border-bottom:none}
.chk{width:20px;height:20px;border:2px solid var(--bdr2);border-radius:5px;cursor:pointer;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .2s;background:var(--surf3)}
.chk.on{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;box-shadow:0 2px 8px rgba(91,75,212,.35)}
.chk.pop{animation:chkpop .35s ease}
@keyframes chkpop{0%{transform:scale(1)}40%{transform:scale(1.45)}70%{transform:scale(.9)}100%{transform:scale(1)}}
.ttl{font-weight:600;font-size:14px}
.ttl.dn{text-decoration:line-through;color:var(--mut);font-weight:400}
.tdsc{font-size:13px;color:var(--mut);margin-top:3px}
.tmeta{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.tb{background:var(--blu-l);color:var(--blu)}
.ta{background:var(--amb-l);color:var(--amb)}
.tg{background:var(--grn-l);color:var(--grn)}

/* DATE NAV */
.wn{display:flex;align-items:center;gap:8px;margin-bottom:1.5rem;flex-wrap:wrap}
.wl{font-size:13px;font-weight:600;color:var(--mut);font-family:var(--mono);background:var(--surf2);padding:6px 14px;border-radius:var(--rs);border:1px solid var(--bdr);min-width:150px;text-align:center}
.wb{width:34px;height:34px;border-radius:var(--rs);border:1.5px solid var(--bdr2);background:var(--surf);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--txt);transition:all .15s}
.wb:hover{background:var(--acc-l);border-color:var(--acc);color:var(--acc)}
.dpick{padding:7px 10px;border:1.5px solid var(--bdr);border-radius:var(--rs);font-size:13px;background:var(--surf3);color:var(--txt);cursor:pointer;outline:none;transition:border-color .15s}
.dpick:focus{border-color:var(--acc)}
.today-btn{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--bdr2);background:var(--surf);color:var(--mut);transition:all .15s}
.today-btn:hover{background:var(--acc-l);border-color:var(--acc);color:var(--acc)}
.pbar{height:8px;background:var(--surf2);border-radius:99px;overflow:hidden;margin-bottom:1.25rem;border:1px solid var(--bdr)}
.pfill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .4s ease}
.pfill.flash{animation:barflash .5s ease}
@keyframes barflash{0%{filter:brightness(1)}50%{filter:brightness(1.5)}100%{filter:brightness(1)}}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(10,8,25,.5);z-index:200;align-items:center;justify-content:center;padding:1rem;display:none}
.modal{background:var(--surf);border-radius:16px;padding:2rem;width:100%;max-width:480px;box-shadow:var(--shm);border:1px solid var(--bdr2)}
.modal-title{font-size:18px;font-weight:700;margin-bottom:1.5rem;letter-spacing:-0.3px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1.5rem}

/* MISC */
.empty{text-align:center;padding:3.5rem 1rem;color:var(--mut)}
.empty-i{font-size:36px;margin-bottom:.75rem}
.empty-t{font-size:15px;font-weight:600;color:var(--txt);margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:2rem}
.sc{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:1.25rem;box-shadow:var(--sh)}
.sn{font-size:30px;font-weight:700;letter-spacing:-0.5px;color:var(--acc)}
.sl{font-size:11px;font-weight:700;color:var(--mut);margin-top:2px;text-transform:uppercase;letter-spacing:.4px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.5rem}
.pill{padding:6px 16px;border-radius:20px;border:1.5px solid var(--bdr2);font-size:13px;font-weight:600;cursor:pointer;background:var(--surf);color:var(--mut);transition:all .15s}
.pill.on{background:var(--acc-l);color:var(--acc);border-color:var(--acc)}
.fchip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;background:var(--acc-l);color:var(--acc);font-size:12px;font-weight:600;cursor:pointer;margin:2px 2px 0 0;border:none;max-width:200px}
.fchip:hover{background:#ddd6f8}
.fchip.sub{background:var(--blu-l);color:var(--blu)}
.fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
.fdl{opacity:.5;font-size:14px;cursor:pointer}
.fdl:hover{opacity:1}
.frow{display:flex;flex-wrap:wrap;margin-top:6px;align-items:center}
.uz{border:2px dashed var(--bdr2);border-radius:var(--r);padding:1rem;text-align:center;cursor:pointer;transition:all .15s;background:var(--surf3);display:block;margin-top:8px}
.uz:hover,.uz.dg{border-color:var(--acc);background:var(--acc-l)}
.uz p{font-size:13px;color:var(--mut);pointer-events:none}
.uz p strong{color:var(--acc)}
.sh{font-size:20px;font-weight:700;margin-bottom:1rem;letter-spacing:-0.3px}
.loading{text-align:center;padding:4rem;color:var(--mut);font-size:14px}
.row-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}

/* QUESTION HUB */
.subj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:1.5rem}
.subj-card{background:var(--surf);border:1.5px solid var(--bdr);border-radius:var(--r);padding:1.25rem;cursor:pointer;transition:all .2s;text-align:center}
.subj-card:hover{border-color:var(--acc);box-shadow:var(--shm);transform:translateY(-2px)}
.subj-card.on{border-color:var(--acc);background:var(--acc-l)}
.subj-emoji{font-size:28px;margin-bottom:.5rem}
.subj-name{font-size:14px;font-weight:700;color:var(--txt)}
.subj-desc{font-size:12px;color:var(--mut);margin-top:2px}
.year-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:1.25rem}
.ytab{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--bdr2);background:var(--surf);color:var(--mut);transition:all .15s}
.ytab.on{background:var(--acc);color:white;border-color:var(--acc)}
.q-card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:1.25rem;margin-bottom:.75rem;box-shadow:var(--sh)}
.q-num{font-size:11px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.4rem}
.q-text{font-size:14px;font-weight:500;line-height:1.6;color:var(--txt)}
.q-meta{display:flex;gap:8px;margin-top:.6rem;flex-wrap:wrap}
.q-ans{background:var(--grn-l);border:1px solid #a8dcc2;border-radius:var(--rs);padding:.75rem 1rem;margin-top:.75rem;font-size:13px;color:var(--grn);display:none}
.q-ans.show{display:block}
.q-actions{display:flex;gap:6px;margin-top:.75rem;flex-wrap:wrap}
.topic-select{padding:8px 12px;border:1.5px solid var(--bdr);border-radius:var(--rs);font-size:13px;background:var(--surf3);color:var(--txt);outline:none;cursor:pointer}
.topic-select:focus{border-color:var(--acc)}
.ai-generating{text-align:center;padding:2rem;color:var(--mut)}
.ai-generating .spin{width:28px;height:28px;border:3px solid var(--bdr2);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto .75rem}
@keyframes spin{to{transform:rotate(360deg)}}

/* CONFETTI */
.confetti-piece{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:9999;animation:confettiFall 1.2s ease-in forwards}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

@media(max-width:768px){.sidebar{display:none}.content{padding:1rem}.stats{grid-template-columns:1fr 1fr}.subj-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div id="setup-view" class="screen" style="display:none">
    <div class="auth-card">
      <div class="brand"><div class="brand-ic"><svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 000 4h6a2 2 0 000-4M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg></div><span class="brand-name">Flow</span></div>
      <h2 class="auth-title">Set up Flow</h2><p class="auth-sub">Create your admin account to get started</p>
      <div id="setup-err" class="err"></div>
      <div class="field"><label>Your name</label><input id="s-name" placeholder="e.g. Sarah"/></div>
      <div class="field"><label>Email</label><input id="s-email" type="email" placeholder="admin@yoursite.com"/></div>
      <div class="field"><label>Password</label><input id="s-pass" type="password" placeholder="Choose a password"/></div>
      <button class="btn btn-p" onclick="doSetup()">Create admin account</button>
    </div>
  </div>
  <div id="login-view" class="screen" style="display:none">
    <div class="auth-card">
      <div class="brand"><div class="brand-ic"><svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 000 4h6a2 2 0 000-4M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg></div><span class="brand-name">Flow</span></div>
      <h2 class="auth-title">Welcome back</h2><p class="auth-sub">Sign in to your account</p>
      <div id="login-err" class="err"></div>
      <div class="field"><label>Email</label><input id="l-email" type="email" placeholder="you@example.com"/></div>
      <div class="field"><label>Password</label><input id="l-pass" type="password" placeholder="••••••••"/></div>
      <button class="btn btn-p" onclick="doLogin()">Sign in</button>
      <div class="toggle">New client? <a onclick="showReg()">Create account</a></div>
    </div>
  </div>
  <div id="reg-view" class="screen" style="display:none">
    <div class="auth-card">
      <div class="brand"><div class="brand-ic"><svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 000 4h6a2 2 0 000-4M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg></div><span class="brand-name">Flow</span></div>
      <h2 class="auth-title">Create account</h2><p class="auth-sub">Register as a client</p>
      <div id="reg-err" class="err"></div>
      <div class="field"><label>Full name</label><input id="r-name" placeholder="Jane Smith"/></div>
      <div class="field"><label>Email</label><input id="r-email" type="email" placeholder="you@example.com"/></div>
      <div class="field"><label>Password</label><input id="r-pass" type="password" placeholder="Min. 4 characters"/></div>
      <button class="btn btn-p" onclick="doReg()">Create account</button>
      <div class="toggle">Already have an account? <a onclick="showLogin()">Sign in</a></div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="hdr">
    <div class="brand"><div class="brand-ic"><svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 000 4h6a2 2 0 000-4M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg></div><span class="brand-name">Flow</span></div>
    <div class="hdr-r">
      <div class="ubadge"><div class="av" id="hdr-av"></div><span id="hdr-name"></span><span class="rtag" id="hdr-role"></span></div>
      <button class="btn btn-s btn-sm" onclick="logout()">Sign out</button>
    </div>
  </div>
  <div class="app-body">
    <div class="sidebar">
      <div class="pomo-widget">
        <div class="pomo-label">Pomodoro Timer</div>
        <div class="pomo-modes">
          <button class="pomo-mode on" onclick="setPomoMode(25,this)">Focus</button>
          <button class="pomo-mode" onclick="setPomoMode(5,this)">Short</button>
          <button class="pomo-mode" onclick="setPomoMode(15,this)">Long</button>
        </div>
        <div class="pomo-time" id="pomo-time">25:00</div>
        <div class="pomo-bar"><div class="pomo-fill" id="pomo-fill" style="width:100%"></div></div>
        <div class="pomo-btns">
          <button class="pomo-btn active" id="pomo-start" onclick="togglePomo()">Start</button>
          <button class="pomo-btn" onclick="resetPomo()">Reset</button>
        </div>
      </div>
      <div class="nav-sep"></div>
      <div class="nav-label">Navigation</div>
      <div id="nav-items"></div>
    </div>
    <div class="content">
      <div id="admin-view" style="display:none">
        <div id="at-tasks"></div>
        <div id="at-clients" style="display:none"></div>
      </div>
      <div id="client-view" style="display:none"></div>
      <div id="qhub-view" style="display:none"></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div id="modal-overlay" class="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title" id="m-title"></div>
    <div id="m-body"></div>
    <div class="modal-actions" id="m-actions"></div>
  </div>
</div>

<script>
const SURL='https://eihvonzcjtxsniyzuskt.supabase.co';
const SKEY='sb_publishable_Xt6taqN9vkSHx09WM-hTdA_ckF8rVxi';
const sb=supabase.createClient(SURL,SKEY);
let CU=null,selC=null,adminDate=null,clientDate=null;

// ── UTILS ────────────────────────────────────────────────────────
function gid(){return '_'+Math.random().toString(36).slice(2)+Date.now();}
function ini(n){return n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function showErr(id,msg){const e=document.getElementById(id);e.textContent=msg;e.style.display='block';}
function hideErr(id){document.getElementById(id).style.display='none';}
function readF(file){return new Promise((r,j)=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=j;fr.readAsDataURL(file);});}

// ── DATE ─────────────────────────────────────────────────────────
function todayKey(){return new Date().toISOString().split('T')[0];}
function getMonday(ds){const d=ds?new Date(ds+'T00:00:00'):new Date();const dy=d.getDay();d.setDate(d.getDate()-dy+(dy===0?-6:1));return d;}
function weekKey(ds){return getMonday(ds).toISOString().split('T')[0];}
function weekLabel(ds){const s=getMonday(ds),e=new Date(s);e.setDate(e.getDate()+6);const f=d=>d.toLocaleDateString('en-AU',{day:'numeric',month:'short'});return`${f(s)} – ${f(e)}`;}
function shiftWeek(ds,dir){const d=getMonday(ds||todayKey());d.setDate(d.getDate()+dir*7);return d.toISOString().split('T')[0];}

// ── CONFETTI ─────────────────────────────────────────────────────
function launchConfetti(x,y){
  const colors=['#5B4BD4','#7B68E8','#FFB547','#FF4D8D','#00E5A0','#4D9FFF','#FF6B6B','#FFF'];
  for(let i=0;i<28;i++){
    const el=document.createElement('div');
    el.className='confetti-piece';
    el.style.cssText=`left:${x+Math.random()*80-40}px;top:${y}px;background:${colors[Math.floor(Math.random()*colors.length)]};transform:rotate(${Math.random()*360}deg);animation-duration:${.8+Math.random()*.8}s;animation-delay:${Math.random()*.2}s`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),2000);
  }
}

// ── SOUND ────────────────────────────────────────────────────────
function playDone(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const notes=[523,659,784,1047];
    notes.forEach((freq,i)=>{
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.connect(gain);gain.connect(ctx.destination);
      osc.frequency.value=freq;
      osc.type='sine';
      gain.gain.setValueAtTime(0,ctx.currentTime+i*.1);
      gain.gain.linearRampToValueAtTime(.15,ctx.currentTime+i*.1+.02);
      gain.gain.linearRampToValueAtTime(0,ctx.currentTime+i*.1+.18);
      osc.start(ctx.currentTime+i*.1);
      osc.stop(ctx.currentTime+i*.1+.2);
    });
  }catch{}
}

function celebrateTask(el){
  const rect=el.getBoundingClientRect();
  launchConfetti(rect.left+rect.width/2,rect.top);
  playDone();
  el.classList.add('pop');
  setTimeout(()=>el.classList.remove('pop'),400);
}

// ── POMODORO ─────────────────────────────────────────────────────
let pomoTotal=25*60,pomoLeft=25*60,pomoRunning=false,pomoInterval=null;
function setPomoMode(mins,btn){
  clearInterval(pomoInterval);pomoRunning=false;pomoTotal=mins*60;pomoLeft=mins*60;
  document.getElementById('pomo-start').textContent='Start';
  document.getElementById('pomo-start').classList.add('active');
  document.querySelectorAll('.pomo-mode').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');renderPomo();
}
function togglePomo(){
  if(pomoRunning){
    clearInterval(pomoInterval);pomoRunning=false;
    document.getElementById('pomo-start').textContent='Resume';
    document.getElementById('pomo-start').classList.remove('active');
  } else {
    pomoRunning=true;
    document.getElementById('pomo-start').textContent='Pause';
    document.getElementById('pomo-start').classList.add('active');
    pomoInterval=setInterval(()=>{
      if(pomoLeft<=0){clearInterval(pomoInterval);pomoRunning=false;playDone();alert("Time's up! Take a break 🎉");document.getElementById('pomo-start').textContent='Start';document.getElementById('pomo-start').classList.add('active');return;}
      pomoLeft--;renderPomo();
    },1000);
  }
}
function resetPomo(){clearInterval(pomoInterval);pomoRunning=false;pomoLeft=pomoTotal;document.getElementById('pomo-start').textContent='Start';document.getElementById('pomo-start').classList.add('active');renderPomo();}
function renderPomo(){const m=Math.floor(pomoLeft/60),s=pomoLeft%60;document.getElementById('pomo-time').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;document.getElementById('pomo-fill').style.width=(pomoLeft/pomoTotal*100)+'%';}

async function dbUsers(){const{data}=await sb.from('users').select('*');return data||[];}
async function dbTasks(){const{data}=await sb.from('tasks').select('*');return data||[];}
async function dbCompletions(){const{data}=await sb.from('completions').select('*');return data||[];}
async function dbFiles(){const{data}=await sb.from('files').select('*');return data||[];}

// ── AUTH ─────────────────────────────────────────────────────────
async function doSetup(){
  hideErr('setup-err');
  const name=document.getElementById('s-name').value.trim(),email=document.getElementById('s-email').value.trim(),pass=document.getElementById('s-pass').value;
  if(!name||!email||!pass)return showErr('setup-err','Please fill in all fields.');
  if(pass.length<4)return showErr('setup-err','Password must be at least 4 characters.');
  const{error}=await sb.from('users').insert({id:gid(),name,email,password:pass,role:'admin'});
  if(error)return showErr('setup-err','Error: '+error.message);
  enterApp({id:gid(),name,email,role:'admin'});
}
async function doLogin(){
  hideErr('login-err');
  const email=document.getElementById('l-email').value.trim(),pass=document.getElementById('l-pass').value;
  const{data}=await sb.from('users').select('*').eq('email',email).eq('password',pass).single();
  if(!data)return showErr('login-err','Invalid email or password.');
  enterApp(data);
}
async function doReg(){
  hideErr('reg-err');
  const name=document.getElementById('r-name').value.trim(),email=document.getElementById('r-email').value.trim(),pass=document.getElementById('r-pass').value;
  if(!name||!email||!pass)return showErr('reg-err','Please fill in all fields.');
  if(pass.length<4)return showErr('reg-err','Password must be at least 4 characters.');
  const{data:ex}=await sb.from('users').select('id').eq('email',email).single();
  if(ex)return showErr('reg-err','Email already registered.');
  const nu={id:gid(),name,email,password:pass,role:'client'};
  const{error}=await sb.from('users').insert(nu);
  if(error)return showErr('reg-err','Error: '+error.message);
  enterApp(nu);
}
function showLogin(){['setup-view','reg-view'].forEach(id=>document.getElementById(id).style.display='none');document.getElementById('login-view').style.display='';}
function showReg(){['setup-view','login-view'].forEach(id=>document.getElementById(id).style.display='none');document.getElementById('reg-view').style.display='';}

function enterApp(u){
  CU=u;
  localStorage.setItem('flow_session',JSON.stringify({id:u.id,name:u.name,email:u.email,role:u.role}));
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('hdr-av').textContent=ini(u.name);
  document.getElementById('hdr-name').textContent=u.name;
  const rt=document.getElementById('hdr-role');
  rt.textContent=u.role==='admin'?'Admin':'Client';
  rt.className='rtag'+(u.role==='client'?' cl':'');
  adminDate=todayKey();clientDate=todayKey();
  buildNav(u.role);
  if(u.role==='admin'){document.getElementById('admin-view').style.display='';showATab('tasks');}
  else{document.getElementById('client-view').style.display='';renderClient();}
}
function logout(){
  CU=null;localStorage.removeItem('flow_session');
  document.getElementById('app').style.display='none';
  ['admin-view','client-view','qhub-view'].forEach(id=>document.getElementById(id).style.display='none');
  document.getElementById('auth-screen').style.display='';
  showLogin();
}

// ── DATE NAV ─────────────────────────────────────────────────────
function dateNav(cur,onPrev,onNext,onPick,onToday){
  return`<div class="wn">
    <button class="wb" onclick="${onPrev}">&#8592;</button>
    <span class="wl">${weekLabel(cur)}</span>
    <button class="wb" onclick="${onNext}">&#8594;</button>
    <input type="date" class="dpick" value="${cur||todayKey()}" onchange="${onPick}" title="Jump to week"/>
    <button class="today-btn" onclick="${onToday}">Today</button>
  </div>`;
}

  const clients=users.filter(u=>u.role==='client');
  if(!selC&&clients.length)selC=clients[0].id;

  const myTasks=tasks.filter(t=>t.client_id===selC&&t.week_key===wk);
  let h=`<div class="row-top"><span class="sh" style="margin:0">Weekly Tasks</span><button class="btn btn-p btn-sm" style="width:auto" onclick="openAddTask()">+ Add task</button></div>`;
  h+=dateNav(adminDate,'adminDate=shiftWeek(adminDate,-1);renderATasks()','adminDate=shiftWeek(adminDate,1);renderATasks()','adminDate=this.value;renderATasks()','adminDate=todayKey();renderATasks()');

    h+=`<div style="margin-bottom:1.25rem"><p style="font-size:11px;color:var(--mut);margin-bottom:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px">Client</p><div class="pills">`;

          ${af.length?`<div class="frow">${af.map(f=>`<button class="fchip" onclick="dlFile('${esc(f.name)}','${esc(f.data)}')"><span class="fn">&#128206; ${esc(f.name)}</span><span class="fdl" onclick="event.stopPropagation();delFile('${f.id}',true)"> &#xd7;</span></button>`).join('')}</div>`:''}
          ${cf.length?`<div class="frow"><span style="font-size:11px;color:var(--mut);margin-right:4px">Submitted:</span>${cf.map(f=>`<button class="fchip sub" onclick="dlFile('${esc(f.name)}','${esc(f.data)}')"><span class="fn">&#128196; ${esc(f.name)}</span></button>`).join('')}</div>`:''}

        </div>
      </div>`;
    });
    h+=`</div>`;
  }

// ── ADMIN CLIENTS ────────────────────────────────────────────────
async function renderClients(){
  const el=document.getElementById('at-clients');
  el.innerHTML=`<div class="loading">Loading...</div>`;
  const [users,tasks,completions]=await Promise.all([dbUsers(),dbTasks(),dbCompletions()]);
  const clients=users.filter(u=>u.role==='client');
  const wk=weekKey(todayKey());
  const wt=tasks.filter(t=>t.week_key===wk);
  const done=completions.filter(c=>c.week_key===wk&&c.done).length;
  let h=`<span class="sh">Clients</span>`;
  h+=`<div class="stats"><div class="sc"><div class="sn">${clients.length}</div><div class="sl">Total clients</div></div><div class="sc"><div class="sn">${wt.length}</div><div class="sl">Tasks this week</div></div><div class="sc"><div class="sn">${wt.length?Math.round(done/wt.length*100)+'%':'—'}</div><div class="sl">Completion rate</div></div></div>`;
  h+=`<div class="card">`;
  if(!clients.length){h+=`<div class="empty"><div class="empty-i">&#x1F464;</div><div class="empty-t">No clients yet</div></div>`;}
  else clients.forEach(c=>{
    const ct=tasks.filter(t=>t.client_id===c.id&&t.week_key===wk);
    const cd=completions.filter(x=>x.client_id===c.id&&x.week_key===wk&&x.done).length;
    h+=`<div class="ci"><div class="ci-info"><div class="av">${ini(c.name)}</div><div><div style="font-weight:600;font-size:14px">${esc(c.name)}</div><div style="font-size:13px;color:var(--mut)">${esc(c.email)} · ${cd}/${ct.length} tasks this week</div></div></div><button class="btn btn-d btn-sm" onclick="delClient('${c.id}')">Remove</button></div>`;
  });
  h+=`</div>`;
  el.innerHTML=h;
}

async function delClient(id){if(!confirm('Remove this client?'))return;await sb.from('users').delete().eq('id',id);await sb.from('tasks').delete().eq('client_id',id);await sb.from('completions').delete().eq('client_id',id);renderClients();}
async function delTask(id){if(!confirm('Delete this task?'))return;await sb.from('tasks').delete().eq('id',id);await sb.from('completions').delete().eq('task_id',id);await sb.from('files').delete().eq('task_id',id);renderATasks();}

function openEditTask(id,title,desc,priority,category){
  document.getElementById('m-title').textContent='Edit task';
  document.getElementById('m-body').innerHTML=`
    <div class="field"><label>Title</label><input id="m-ttl" value="${title}"/></div>
    <div class="field"><label>Description</label><textarea id="m-dsc" rows="2" style="resize:vertical">${desc}</textarea></div>

    <div class="field"><label>Category</label><input id="m-cat" value="${category}"/></div>`;

async function saveTask(){
  const title=document.getElementById('m-ttl').value.trim();if(!title)return alert('Please enter a title.');
  const wk=weekKey(document.getElementById('m-wk').value);
  await sb.from('tasks').insert({id:gid(),title,description:document.getElementById('m-dsc').value.trim(),client_id:document.getElementById('m-cli').value,week_key:wk,priority:document.getElementById('m-pri').value,category:document.getElementById('m-cat').value.trim(),created_at:Date.now()});
  closeModal();renderATasks();
}
async function updateTask(id){
  const title=document.getElementById('m-ttl').value.trim();if(!title)return alert('Please enter a title.');
  await sb.from('tasks').update({title,description:document.getElementById('m-dsc').value.trim(),priority:document.getElementById('m-pri').value,category:document.getElementById('m-cat').value.trim()}).eq('id',id);
  closeModal();renderATasks();
}
async function handleAdminUp(e,tid){
  for(const file of Array.from(e.target.files)){if(file.size>3*1024*1024){alert(`"${file.name}" too large.`);continue;}try{const data=await readF(file);await sb.from('files').insert({id:gid(),task_id:tid,role:'admin',name:file.name,type:file.type,data});}catch{}}
  e.target.value='';renderATasks();
}

// ── CLIENT TASKS ─────────────────────────────────────────────────
async function renderClient(){
  const el=document.getElementById('client-view');
  el.innerHTML=`<div class="loading">Loading...</div>`;
  const [tasks,completions,files]=await Promise.all([dbTasks(),dbCompletions(),dbFiles()]);
  const wk=weekKey(clientDate);
  const myTasks=tasks.filter(t=>t.client_id===CU.id&&t.week_key===wk);
  const done=myTasks.filter(t=>completions.some(c=>c.client_id===CU.id&&c.week_key===wk&&c.task_id===t.id&&c.done)).length;
  const pct=myTasks.length?Math.round(done/myTasks.length*100):0;
  let h=`<div style="margin-bottom:1.5rem"><div class="sh">Hey, ${esc(CU.name.split(' ')[0])} &#x1F44B;</div><p style="font-size:14px;color:var(--mut)">Here are your tasks for the week</p></div>`;
  h+=dateNav(clientDate,'clientDate=shiftWeek(clientDate,-1);renderClient()','clientDate=shiftWeek(clientDate,1);renderClient()','clientDate=this.value;renderClient()','clientDate=todayKey();renderClient()');

  if(!myTasks.length){h+=`<div class="empty"><div class="empty-i">&#x1F33F;</div><div class="empty-t">No tasks assigned yet</div><p>Your coach will assign tasks here soon</p></div>`;}
  else myTasks.forEach(t=>{
    const isDone=completions.some(c=>c.client_id===CU.id&&c.week_key===wk&&c.task_id===t.id&&c.done);
    const af=files.filter(f=>f.task_id===t.id&&f.role==='admin');
    const cf=files.filter(f=>f.task_id===t.id&&f.role==='client');
    h+=`<div class="ti" style="align-items:flex-start">
      <div class="chk${isDone?' on':''}" id="chk-${t.id}" style="margin-top:2px" onclick="toggleTask('${t.id}','${wk}',${isDone},this)">
        ${isDone?'<svg width="11" height="8" viewBox="0 0 11 8"><path d="M1 4l3 3 6-6" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}
      </div>
      <div style="flex:1;min-width:0">
        <div class="ttl${isDone?' dn':''}">${esc(t.title)}</div>
        ${t.description?`<div class="tdsc">${esc(t.description)}</div>`:''}
        <div class="tmeta">
          ${t.priority==='high'?'<span class="tag ta">High priority</span>':''}
          ${t.category?`<span class="tag tb">${esc(t.category)}</span>`:''}
          ${isDone?'<span class="tag tg">&#10003; Done</span>':''}
        </div>
        ${af.length?`<div class="frow"><span style="font-size:11px;color:var(--mut);margin-right:4px">Resources:</span>${af.map(f=>`<button class="fchip" onclick="dlFile('${esc(f.name)}','${esc(f.data)}')"><span class="fn">&#128206; ${esc(f.name)}</span></button>`).join('')}</div>`:''}
        <div style="margin-top:10px">
          <div style="font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Your submission</div>
          ${cf.length?`<div class="frow">${cf.map(f=>`<button class="fchip sub" onclick="dlFile('${esc(f.name)}','${esc(f.data)}')"><span class="fn">&#128196; ${esc(f.name)}</span><span class="fdl" onclick="event.stopPropagation();delFile('${f.id}',false)"> &#xd7;</span></button>`).join('')}</div>`:''}
          <label class="uz" ondragover="event.preventDefault();this.classList.add('dg')" ondragleave="this.classList.remove('dg')" ondrop="handleClientDrop(event,'${t.id}');this.classList.remove('dg')">
            <input type="file" multiple style="display:none" onchange="handleClientUp(event,'${t.id}')">
            <p>Drop files or <strong>browse</strong></p>
          </label>
        </div>
      </div>
    </div>`;
  });
  h+=`</div>`;
  el.innerHTML=h;
}

async function toggleTask(tid,wk,isDone,chkEl){
  if(!isDone){celebrateTask(chkEl);}
  if(isDone){await sb.from('completions').delete().eq('client_id',CU.id).eq('week_key',wk).eq('task_id',tid);}
  else{await sb.from('completions').upsert({client_id:CU.id,week_key:wk,task_id:tid,done:true});}
  setTimeout(()=>renderClient(),300);
}

async function handleClientUp(e,tid){
  for(const file of Array.from(e.target.files)){if(file.size>3*1024*1024){alert(`"${file.name}" too large.`);continue;}try{const data=await readF(file);await sb.from('files').insert({id:gid(),task_id:tid,role:'client',name:file.name,type:file.type,data});}catch{}}
  e.target.value='';renderClient();
}
async function handleClientDrop(e,tid){
  e.preventDefault();
  for(const file of Array.from(e.dataTransfer.files)){if(file.size>3*1024*1024){alert(`"${file.name}" too large.`);continue;}try{const data=await readF(file);await sb.from('files').insert({id:gid(),task_id:tid,role:'client',name:file.name,type:file.type,data});}catch{}}
  renderClient();
}
async function delFile(id,isAdmin){await sb.from('files').delete().eq('id',id);if(isAdmin)renderATasks();else renderClient();}
function dlFile(name,data){const a=document.createElement('a');a.href=data;a.download=name;a.click();}
function closeModal(){document.getElementById('modal-overlay').style.display='none';}

// ── QUESTION HUB ─────────────────────────────────────────────────

  maths:{emoji:'🧮',name:'Mathematics',color:'var(--acc)',topics:{

    11:['Functions','Trigonometric functions','Calculus intro','Series & sequences','Financial maths'],
    12:['Integration','Differential equations','Exponential & log functions','Statistical analysis','Mechanics']
  }},
  english:{emoji:'📚',name:'English',color:'var(--blu)',topics:{

    8:['Persuasive writing','Character analysis','Literary devices','Drama texts','Research skills'],
    9:['Essay structure','Novel study','Language features','Multimodal texts','Argument analysis'],

    7:['Forces & motion','Energy','Sound & light','Simple machines'],

    8:['Elements & compounds','Periodic table intro','Acids & bases intro','Reactions'],
    9:['Atomic structure','Chemical bonding','Reactions & equations','Rates of reaction'],
    10:['Mole concept','Organic chemistry intro','Electrochemistry','Equilibrium intro'],

    12:['Equilibrium & acid reactions','Organic chemistry','Electrochemistry','Monitoring & management']
  }}
};

let qState={subject:'maths',year:12,topic:null,questions:[],customQs:[],showCustomForm:false};

function renderQHub(){
  const el=document.getElementById('qhub-view');
  const subj=SUBJECTS[qState.subject];
  const topics=subj.topics[qState.year]||[];

  let h=`<div class="row-top"><span class="sh" style="margin:0">Question Hub</span></div>`;

  // Subject selector
  h+=`<div class="subj-grid">`;
  Object.entries(SUBJECTS).forEach(([key,s])=>{
    h+=`<div class="subj-card${qState.subject===key?' on':''}" onclick="qState.subject='${key}';qState.topic=null;qState.questions=[];renderQHub()">
      <div class="subj-emoji">${s.emoji}</div>
      <div class="subj-name">${s.name}</div>
    </div>`;
  });
  h+=`</div>`;

  // Year selector
  h+=`<div style="margin-bottom:1rem"><p style="font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Year level</p><div class="year-tabs">`;
  [7,8,9,10,11,12].forEach(y=>{
    h+=`<button class="ytab${qState.year===y?' on':''}" onclick="qState.year=${y};qState.topic=null;qState.questions=[];renderQHub()">${y}</button>`;
  });
  h+=`</div></div>`;

  // Topic selector
  h+=`<div style="margin-bottom:1.5rem"><p style="font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Topic</p>`;
  h+=`<select class="topic-select" onchange="qState.topic=this.value;qState.questions=[];renderQHub()">`;
  h+=`<option value="">— Select a topic —</option>`;
  topics.forEach(t=>{h+=`<option value="${esc(t)}"${qState.topic===t?' selected':''}>${esc(t)}</option>`;});
  h+=`</select></div>`;

  if(qState.topic){
    h+=`<div style="display:flex;gap:8px;margin-bottom:1.5rem;flex-wrap:wrap">`;
    h+=`<button class="btn btn-p btn-sm" style="width:auto" onclick="generateAIQuestions()">&#x2728; Generate AI questions</button>`;
    h+=`<button class="btn btn-s btn-sm" onclick="toggleCustomForm()">+ Add my own question</button>`;
    h+=`</div>`;

    // Custom question form
    if(qState.showCustomForm){
      h+=`<div class="card" style="margin-bottom:1rem;border-color:var(--acc)">
        <div style="font-size:13px;font-weight:700;margin-bottom:.75rem">Add custom question</div>
        <div class="field"><label>Question</label><textarea id="cq-text" rows="3" placeholder="Enter your question..."></textarea></div>
        <div class="field"><label>Answer / marking guide</label><textarea id="cq-ans" rows="2" placeholder="Enter the answer..."></textarea></div>
        <div class="field"><label>Marks</label><select id="cq-marks"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-p btn-sm" style="width:auto" onclick="saveCustomQ()">Save question</button>
          <button class="btn btn-s btn-sm" onclick="qState.showCustomForm=false;renderQHub()">Cancel</button>
        </div>
      </div>`;
    }

    // Custom questions
    if(qState.customQs.length){
      h+=`<div style="margin-bottom:1rem">`;
      h+=`<p style="font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">My questions</p>`;
      qState.customQs.forEach((q,i)=>{
        h+=`<div class="q-card">
          <div class="q-num">Custom · ${q.marks} mark${q.marks>1?'s':''}</div>
          <div class="q-text">${esc(q.text)}</div>
          <div class="q-actions">
            <button class="btn btn-s btn-sm" onclick="toggleAns('cans-${i}')">Show answer</button>
            <button class="btn btn-d btn-sm" onclick="qState.customQs.splice(${i},1);renderQHub()">Delete</button>
          </div>
          <div class="q-ans" id="cans-${i}"><strong>Answer:</strong> ${esc(q.answer)}</div>
        </div>`;
      });
      h+=`</div>`;
    }

    // AI generated questions
    if(qState.questions.length){
      h+=`<p style="font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">AI generated questions</p>`;
      qState.questions.forEach((q,i)=>{
        h+=`<div class="q-card">
          <div class="q-num">Question ${i+1} · ${q.marks} mark${q.marks>1?'s':''} · ${esc(q.difficulty||'Standard')}</div>
          <div class="q-text">${esc(q.question)}</div>
          <div class="q-actions">
            <button class="btn btn-s btn-sm" onclick="toggleAns('aans-${i}')">Show answer</button>
          </div>
          <div class="q-ans" id="aans-${i}"><strong>Model answer:</strong> ${esc(q.answer)}</div>
        </div>`;
      });
      h+=`<div style="margin-top:1rem"><button class="btn btn-s btn-sm" onclick="generateAIQuestions()">&#x21bb; Generate new questions</button></div>`;
    } else if(!qState.showCustomForm){
      h+=`<div class="empty"><div class="empty-i">&#x1F4A1;</div><div class="empty-t">Ready to practice?</div><p>Click "Generate AI questions" to get HSC-style questions for ${esc(qState.topic)}</p></div>`;
    }
  }

  el.innerHTML=h;
}

function toggleAns(id){const el=document.getElementById(id);if(el)el.classList.toggle('show');}
function toggleCustomForm(){qState.showCustomForm=!qState.showCustomForm;renderQHub();}

function saveCustomQ(){
  const text=document.getElementById('cq-text').value.trim();
  const answer=document.getElementById('cq-ans').value.trim();
  const marks=parseInt(document.getElementById('cq-marks').value);
  if(!text)return alert('Please enter a question.');
  qState.customQs.push({text,answer,marks});
  qState.showCustomForm=false;
  renderQHub();
}

async function generateAIQuestions(){
  const el=document.getElementById('qhub-view');
  const subj=SUBJECTS[qState.subject];
  // Show spinner inline
  const existing=el.querySelector('.q-ans')?.closest('.card');
  const spinDiv=document.createElement('div');
  spinDiv.className='ai-generating';
  spinDiv.innerHTML=`<div class="spin"></div><p>Generating Year ${qState.year} ${subj.name} questions on <strong>${qState.topic}</strong>...</p>`;
  // append spinner
  const content=el;
  content.appendChild(spinDiv);

  const prompt=`You are an expert Australian HSC tutor. Generate 5 unique, varied practice questions for Year ${qState.year} ${subj.name}, topic: "${qState.topic}".

Requirements:
- Mix of difficulty: easy, medium, hard
- Vary question types: short answer, calculation, explain, analyse
- Each question should be clearly different from the others
- Use Australian curriculum context where relevant
- For Year 11-12, align with NSW HSC syllabus style

Respond ONLY with a JSON array, no markdown, no extra text:
[
  {"question":"...","answer":"...","marks":2,"difficulty":"Easy"},
  {"question":"...","answer":"...","marks":3,"difficulty":"Medium"},
  ...
]`;

  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        messages:[{role:'user',content:prompt}]
      })
    });
    const data=await resp.json();
    const text=data.content?.map(c=>c.text||'').join('').trim();
    const clean=text.replace(/```json|```/g,'').trim();
    const questions=JSON.parse(clean);
    qState.questions=questions;
  }catch(e){
    qState.questions=[{question:'Could not generate questions. Please try again.',answer:'',marks:0,difficulty:''}];
  }
  renderQHub();
}

  const saved=localStorage.getItem('flow_session');
  if(saved){try{enterApp(JSON.parse(saved));return;}catch{}}
  document.getElementById('auth-screen').style.display='';
  const hasAdmin=await isAdminSetup();
  if(!hasAdmin){document.getElementById('setup-view').style.display='';}
  else{document.getElementById('login-view').style.display='';}
}
init();
</script>
